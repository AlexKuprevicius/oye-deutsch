<style>
/* Layout: single-column phone app. Views (levels / practice / exam / stats / settings) swap inside one wrapper; fixed bottom tab bar. */
:root{
  --bg:#F4F3F8; --surface:#FFFFFF; --ink:#1A1D2B; --muted:#5D6175; --line:#DCDBE6;
  --accent:#2F3FC4; --accent-ink:#FFFFFF; --sound:#D9541E; --sound-bg:#FCE7DC;
  --ok:#1E7A4C; --ok-bg:#DDF2E6; --warn:#9A5B00; --warn-bg:#FBEFD5; --bad:#B42335; --bad-bg:#F9E0E3;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131A; --surface:#1C1E29; --ink:#ECEDF5; --muted:#A3A6BA; --line:#2E3142;
  --accent:#8E9BFF; --accent-ink:#10122A; --sound:#FF8A55; --sound-bg:#3A2218;
  --ok:#6FD39F; --ok-bg:#163326; --warn:#F2C26B; --warn-bg:#3A2D12; --bad:#FF8C99; --bad-bg:#3D1A20; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131A; --surface:#1C1E29; --ink:#ECEDF5; --muted:#A3A6BA; --line:#2E3142;
  --accent:#8E9BFF; --accent-ink:#10122A; --sound:#FF8A55; --sound-bg:#3A2218;
  --ok:#6FD39F; --ok-bg:#163326; --warn:#F2C26B; --warn-bg:#3A2D12; --bad:#FF8C99; --bad-bg:#3D1A20; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--sound)}
h2{font-family:var(--display);font-weight:700;font-size:1.4rem;margin:0;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.word{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,11vw,3.4rem);line-height:1.05;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.word.sentence{font-size:clamp(1.4rem,6.5vw,2rem)}
.word mark{background:var(--sound-bg);color:var(--sound);border-radius:8px;padding:0 .08em}
.ipa{color:var(--muted)}
.note{background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.speak{background:var(--sound);border-color:var(--sound);color:var(--bg);font-weight:700;font-size:1.15rem;min-height:56px;border-radius:16px;width:100%}
button.ghost{border-color:transparent;background:none;padding-left:4px;color:var(--accent);font-weight:700}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none}
button.speak.live{background:var(--bad);border-color:var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){button.speak.live{animation:none}}
.status{margin:0;color:var(--muted);min-height:1.5em}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:.92rem}
input[type=text]{font:inherit;font-size:1.15rem;width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.fb{border-radius:14px;padding:12px 14px}
.fb.ok{background:var(--ok-bg);color:var(--ok)} .fb.warn{background:var(--warn-bg);color:var(--warn)} .fb.bad{background:var(--bad-bg);color:var(--bad)}
.tok{display:inline-block;margin:2px 4px 2px 0;padding:0 6px;border-radius:6px}
.tok.y{background:var(--ok-bg);color:var(--ok)} .tok.n{background:var(--bad-bg);color:var(--bad);text-decoration:underline}
.nav2{display:flex;justify-content:space-between;gap:10px}
.native{color:var(--accent);font-size:.95rem;font-weight:700;text-decoration:none}
.banner{background:var(--bad-bg);color:var(--bad);border-radius:14px;padding:12px 14px;font-size:.95rem}
.tip{margin:0}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.list button.w{flex:1;min-width:0;text-align:left;border:0;border-radius:0;background:none;padding:12px 2px;font-size:1.1rem}
.list button.w[aria-current="true"]{font-weight:700;color:var(--accent)}
.list button.w mark{background:none;color:var(--sound);font-weight:700}
.cnt{font-variant-numeric:tabular-nums;color:var(--ok);font-size:.85rem;white-space:nowrap}
.play{min-width:44px;width:44px;height:44px;padding:0;display:grid;place-items:center}
.play svg{width:18px;height:18px;fill:currentColor}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair span{color:var(--muted);font-size:.85rem}
/* level map */
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px}
.levels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.lvl{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border-radius:18px;padding:12px 14px;background:var(--surface)}
.lvl .badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem;background:var(--sound-bg);color:var(--sound);line-height:1;text-align:center;padding:2px}
.lvl.done .badge{background:var(--ok-bg);color:var(--ok)}
.lvl.locked{opacity:.55}
.lvl.locked .badge{background:var(--line);color:var(--muted)}
.lvl b{display:block;font-size:1.02rem}
.lvl small{color:var(--muted)}
.lvl .st{font-size:.85rem;font-weight:700;white-space:nowrap}
.lvl.done .st{color:var(--ok)}
.lvl.current{border:2px solid var(--accent)}
/* stats */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile .v{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{color:var(--muted);font-size:.85rem}
.big{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dots i.y{background:var(--ok)} .dots i.n{background:var(--bad)} .dots i.c{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.help ol{margin:6px 0 0;padding-left:20px}
.help h3{margin:10px 0 0;font-size:1rem}
/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:4px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;max-width:180px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:.85rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px}
.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--accent);background:var(--bg)}
@media (prefers-reduced-motion:reduce){button:active{transform:none}}
</style>

   {w:"sch[ö]n",ipa:"ʃøːn"},{w:"h[ö]ren",ipa:"ˈhøːʁən"},{w:"m[ö]chte",ipa:"ˈmœçtə"},{w:"zw[ö]lf",ipa:"tsvœlf"},{w:"Gr[ö]ße",ipa:"ˈɡʁøːsə"},{w:"K[ö]ln",ipa:"kœln"}],

  words:[{w:"sch[o]n",ipa:"ʃoːn"},{w:"sch[ö]n",ipa:"ʃøːn"},{w:"M[u]tter",ipa:"ˈmʊtɐ"},{w:"M[ü]tter",ipa:"ˈmʏtɐ"},{w:"k[e]nnen",ipa:"ˈkɛnən"},{w:"k[ö]nnen",ipa:"ˈkœnən"}],

 {id:"r",chip:"r",title:{es:"La r de garganta",de:"Das Rachen-R"},
  tip:{es:"No vibres la punta de la lengua. La punta descansa detrás de los dientes de abajo y el sonido sale de atrás, de la garganta: como una «j» de «jamón» muy suave pero con voz, o unas gárgaras ligeras. Al final de palabra («-er», «-r») casi desaparece y suena como una «a» corta: «Mutter» ≈ «Mutta».",de:"Nicht mit der Zungenspitze rollen. Die Spitze liegt hinter den unteren Zähnen, der Laut kommt hinten aus dem Rachen: wie ein sehr weiches spanisches «j» mit Stimme, oder leichtes Gurgeln. Am Wortende («-er», «-r») klingt es fast wie ein kurzes «a»: «Mutter» ≈ «Mutta»."},

/* ================= state ================= */
const KEY="smb2";
function fresh(){return{lang:(navigator.language||"").toLowerCase().startsWith("es")?"es":"de",rate:0.9,test:false,best:{},words:{},stats:{tries:0,ok:0,listens:0,secs:0},days:[],custom:[]}}
let S=fresh();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(fresh(),JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const L=()=>T[S.lang];
const tx=o=>o?(typeof o==="string"?o:(o[S.lang]||o.es)):"";

/* ui state (not persisted) */
let view="home", lvl=0, wi=0, exam=null, confirmReset=false, flash="";

/* ================= helpers ================= */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=s=>s.replace(/[\[\]]/g,"");
const marked=s=>esc(s).replace(/\[([^\]]+)\]/g,"<mark>$1</mark>");
const norm=s=>s.toLowerCase().replace(/ß/g,"ss").replace(/[.,!?¿¡;:"'«»„“”]/g," ").replace(/\s+/g," ").trim();
const deUml=s=>s.replace(/ö/g,"o").replace(/ü/g,"u").replace(/ä/g,"a");
const today=()=>new Date().toISOString().slice(0,10);
const playIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
function markDay(){const d=today();if(!S.days.includes(d)){S.days.push(d);if(S.days.length>400)S.days=S.days.slice(-400)}}
function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(today()))d.setDate(d.getDate()-1);
  while(set.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n}
function unlocked(i){return S.test||i===0||(S.best[SETS[i-1].id]||0)>=PASS}
function isPassed(i){return (S.best[SETS[i].id]||0)>=PASS}
function currentSet(){return lvl===-1?{id:"own",title:{es:T.es.own,de:T.de.own},tip:"",words:S.custom.map(w=>({w}))}:SETS[lvl]}

/* ================= speech output ================= */
const hasTTS=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";
let voice=null;
function pickVoice(){if(!hasTTS)return;const vs=speechSynthesis.getVoices().filter(v=>/^de([-_]|$)/i.test(v.lang));
  voice=vs.find(v=>/de[-_]DE/i.test(v.lang)&&v.localService)||vs.find(v=>/de[-_]DE/i.test(v.lang))||vs[0]||null}
if(hasTTS){pickVoice();try{speechSynthesis.addEventListener("voiceschanged",pickVoice)}catch(e){speechSynthesis.onvoiceschanged=pickVoice}}
function ttsWarn(on){const b=document.getElementById("ttsWarn");if(b)b.hidden=!on}
function speak(text,slow){
  S.stats.listens++;markDay();save();
  if(!hasTTS){ttsWarn(true);return}
  if(!voice)pickVoice();
  const go=()=>{let started=false;
    const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";if(voice)u.voice=voice;
    u.rate=slow?Math.max(.35,S.rate*.55):S.rate;u.pitch=1;u.volume=1;
    u.onstart=()=>{started=true;ttsWarn(false)};u.onerror=()=>{if(!started)ttsWarn(true)};
    try{speechSynthesis.resume()}catch(e){}
    speechSynthesis.speak(u);
    setTimeout(()=>{if(!started&&!speechSynthesis.speaking)ttsWarn(true)},2500)};
  /* iOS and Android both drop speak() issued right after cancel() */
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,150)}else go();
}

/* ================= evaluation ================= */
function evaluate(target,heard){
  const t=norm(target),h=norm(heard),l=L();
  if(!h)return{ok:false,cls:"warn",html:esc(l.fbEmpty),empty:true};
  const tt=t.split(" "),ht=h.split(" ");
  if(t===h||(tt.length>1&&tt.every(x=>ht.includes(x))))return{ok:true,cls:"ok",html:`<b>${esc(l.fbOk)}</b> «${esc(heard.trim())}»`};
  if(tt.length>1){const toks=tt.map(x=>`<span class="tok ${ht.includes(x)?"y":"n"}">${esc(x)}</span>`).join("");
    return{ok:false,cls:"warn",html:`${esc(l.fbHeard)} «${esc(heard.trim())}»<br>${esc(l.fbAlmost)}<br>${toks}`}}
  let hint="";
  if(deUml(t)===deUml(h)||deUml(t)===h.replace(/e/g,"o")){hint=t.includes("ö")?l.hOe:t.includes("ü")?l.hUe:l.hUml}
  else if(t.includes("sch")&&(h===t.replace(/sch/g,"s")||h===t.replace(/sch/g,"ch")||h==="e"+t))hint=t.startsWith("sch")&&h==="e"+t?l.hE:l.hSch;
  else if(/^(sp|st)/.test(t)&&h==="e"+t)hint=l.hE;
  else if(t.includes("ch")&&!t.includes("sch")&&h===t.replace(/ch/g,"sch"))hint=l.hChSch;
  else if(t.includes("ch")&&h.replace(/sch|tsch|k|j/g,"ch")===t)hint=l.hCh;
  else if(t.startsWith("h")&&h===t.slice(1))hint=l.hH;
  else if(t.includes("r")&&(h===t.replace(/r/g,"l")||h===t.replace(/r/g,"")||h===t.replace(/r/g,"rr")))hint=l.hR;
  return{ok:false,cls:"bad",html:`${esc(l.fbHeard)} <b>«${esc(heard.trim())}»</b><br>${esc(hint||l.fbRetry)}`};
}
function record(word,ok){
  const k=plain(word);const r=S.words[k]||(S.words[k]={ok:0,fail:0});
  ok?r.ok++:r.fail++;S.stats.tries++;if(ok)S.stats.ok++;markDay();save();
}

  return `<div class="row"><button class="ghost" data-act="home">${esc(l.back)}</button></div>
  <header><div class="label">${own?"":esc(l.level)+" "+(lvl+1)}</div><h2>${esc(tx(s.title))}</h2></header>
  <div class="banner" id="ttsWarn" ${hasTTS?"hidden":""}>${esc(hasTTS?l.ttsFail:l.noTts)}</div>
  ${own?`<section class="card"><label class="label" for="ownIn">${esc(l.ownSub)}</label><input type="text" id="ownIn" lang="de" placeholder="${esc(l.addPh)}" autocomplete="off"><button class="primary" data-act="add">${esc(l.add)}</button></section>`:`<p class="tip">${esc(tx(s.tip))}</p>`}
  ${s.words.length?practiceCard():`<p class="sub">${esc(l.ownNone)}</p>`}
  ${own?"":`<section class="card"><div class="label">${esc(l.exam)}</div><p style="margin:0">${esc(l.examInfo)}</p>
    ${S.best[s.id]!=null?`<div class="sub">${esc(l.best)}: ${S.best[s.id]} %</div>`:""}
    <button class="primary" data-act="exam">${esc(l.startExam)}</button></section>`}
  ${s.words.length?`<section class="card"><div class="label">${esc(l.words)}</div><ul class="list">${list}</ul>${pairs}</section>`:""}`;
}

function vExam(){
  const l=L(),s=SETS[exam.lvl],idx=exam.order[exam.i],w=s.words[idx],p=plain(w.w);
  const dots=exam.order.map((_,k)=>`<i class="${exam.res[k]===true?"y":exam.res[k]===false?"n":""} ${k===exam.i?"c":""}"></i>`).join("");
  return `<div class="row"><button class="ghost" data-act="levelback">${esc(l.back)}</button></div>
  <header><div class="label">${esc(l.exam)} · ${esc(l.level)} ${exam.lvl+1}</div><h2>${esc(tx(s.title))}</h2></header>
  <div class="banner" id="ttsWarn" ${hasTTS?"hidden":""}>${esc(hasTTS?l.ttsFail:l.noTts)}</div>
  <section class="card" aria-live="polite">
   <div class="row" style="justify-content:space-between"><span class="label">${esc(l.itemOf(exam.i+1,exam.order.length))}</span><span class="label">${esc(l.attempt(exam.tries+1))}</span></div>
   <div class="dots">${dots}</div>
   <p class="word ${p.includes(" ")?"sentence":""}">${marked(w.w)}</p>
   <div class="row"><button data-act="listen">${esc(l.listen)}</button><button data-act="slow">${esc(l.slow)}</button></div>
   ${speakBlock()}
   <div class="row" id="examCtl"><button data-act="eskip">${esc(l.skip)}</button></div>
  </section>`;
}

function vResult(){
  const l=L(),s=SETS[exam.lvl],n=exam.res.filter(x=>x).length,pct=Math.round(n/exam.order.length*100),ok=pct>=PASS;
  const nx=SETS[exam.lvl+1];
  const rows=exam.order.map((idx,k)=>`<li><span class="w" style="flex:1;padding:12px 2px">${exam.res[k]?"✓":"✗"} ${marked(s.words[idx].w)}</span><button class="play" data-say="${esc(plain(s.words[idx].w))}" aria-label="${esc(l.listen)}">${playIcon}</button></li>`).join("");
  return `<header><div class="label">${esc(l.result)} · ${esc(l.level)} ${exam.lvl+1}</div><h2>${esc(tx(s.title))}</h2></header>
  <section class="card"><div class="big" style="color:var(${ok?"--ok":"--bad"})">${pct} %</div><div class="sub">${esc(l.correctOf(n,exam.order.length))}</div>
   <div class="fb ${ok?"ok":"bad"}">${esc(ok?l.pass(nx?tx(nx.title):""):l.fail)}</div>
   <div class="row">${ok&&nx?`<button class="primary" data-act="open" data-i="${exam.lvl+1}">${esc(l.nextLevel)}</button>`:""}
   <button ${ok?"":'class="primary"'} data-act="exam">${esc(l.retryExam)}</button><button data-act="home">${esc(l.toLevels)}</button></div></section>
  <section class="card"><ul class="list">${rows}</ul></section>`;
}

function vStats(){
  const l=L(),st=S.stats,h=Math.floor(st.secs/3600),m=Math.floor(st.secs%3600/60);
  const practiced=Object.keys(S.words).length,rate=st.tries?Math.round(st.ok/st.tries*100):0;
  const exams=SETS.filter((s,i)=>isPassed(i)).length;
  const hard=Object.entries(S.words).filter(([k,r])=>r.fail>r.ok).sort((a,b)=>(b[1].fail-b[1].ok)-(a[1].fail-a[1].ok)).slice(0,12);
  const tile=(v,k)=>`<div class="tile"><div class="v">${esc(v)}</div><div class="k">${esc(k)}</div></div>`;
  const lv=SETS.map((s,i)=>{const b=S.best[s.id];return `<li style="display:grid;grid-template-columns:1fr 90px 46px;gap:10px;align-items:center;padding:8px 0"><span style="min-width:0">${i+1}. ${esc(tx(s.title))}</span>
    <span class="progress"><i style="width:${b||0}%;${b!=null&&b<PASS?"background:var(--warn)":""}"></i></span><span class="cnt" style="color:var(--muted);text-align:right">${b!=null?b+" %":"–"}</span></li>`}).join("");
  return `<header><h2>${esc(l.tStats)}</h2></header>
  <div class="tiles">${tile(l.hm(h,m),l.sTime)}${tile(streak(),l.sStreak)}${tile(practiced,l.sWords)}${tile(rate+" %",l.sRate)}${tile(st.tries,l.sTries)}${tile(exams+" / "+SETS.length,l.sExams)}</div>
  <section class="card"><div class="label">${esc(l.sHard)}</div><div class="sub" style="margin:0">${esc(l.sHardSub)}</div>
   ${hard.length?`<ul class="list">${hard.map(([k,r])=>`<li><span style="flex:1;padding:10px 2px">${esc(k)}</span><span class="cnt" style="color:var(--bad)">✗ ${r.fail} · ✓ ${r.ok}</span><button class="play" data-say="${esc(k)}" aria-label="${esc(l.listen)} ${esc(k)}">${playIcon}</button></li>`).join("")}</ul>`:`<p style="margin:0">${esc(l.sHardNone)}</p>`}</section>
  <section class="card"><div class="label">${esc(l.sLevels)}</div><ul style="list-style:none;margin:0;padding:0">${lv}</ul></section>
  <p class="sub">${esc(l.sSaved)}</p>`;
}

function vSettings(){
  const l=L();
  return `<header><h2>${esc(l.tSet)}</h2></header>
  <section class="card"><div class="label">${esc(l.lang)}</div>
   <div class="seg"><button data-act="lang" data-v="de" aria-pressed="${S.lang==="de"}">Deutsch</button><button data-act="lang" data-v="es" aria-pressed="${S.lang==="es"}">Español</button></div></section>
  <section class="card"><label class="label" for="rate">${esc(l.rate)}: <span id="rateV">${S.rate.toFixed(2)}×</span></label>
   <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${S.rate}">
   <div class="row"><button data-say="Brötchen">${esc(l.listen)}: Brötchen</button></div></section>
  <section class="card"><div class="switch"><div><b>${esc(l.test)}</b><div class="sub" style="margin:0">${esc(l.testSub)}</div></div>
   <button data-act="test" aria-pressed="${S.test}" style="min-width:72px">${S.test?"AN / ON":"AUS / OFF"}</button></div></section>
  <section class="card help"><div class="label">${esc(l.help)}</div>
   <h3>${esc(l.iph)}</h3><ol>${l.helpI.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <h3>${esc(l.and)}</h3><ol>${l.helpA.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <p style="margin:6px 0 0" class="sub">${esc(l.helpN)}</p></section>
  <section class="card">${confirmReset?`<p style="margin:0"><b>${esc(l.resetQ)}</b></p><div class="row"><button class="primary" data-act="resetyes" style="background:var(--bad);border-color:var(--bad)">${esc(l.yes)}</button><button data-act="resetno">${esc(l.no)}</button></div>`
   :`<button data-act="reset">${esc(l.reset)}</button>`}${flash?`<div class="fb ok">${esc(flash)}</div>`:""}</section>`;
}

const ICONS={levels:'<path d="M4 20h4v-6H4zM10 20h4V9h-4zM16 20h4V4h-4z"/>',stats:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/>'};
function tabs(){const l=L(),act=view==="stats"?"stats":view==="settings"?"settings":"levels";
  document.getElementById("tabs").innerHTML=[["levels",l.tLevels,"home"],["stats",l.tStats,"stats"],["settings",l.tSet,"settings"]]
   .map(([k,t,v])=>`<button data-act="tab" data-v="${v}" aria-current="${act===k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${esc(t)}</button>`).join("")}

function render(scrollTop){
  if(recActive)stopRec();
  document.documentElement.lang=S.lang;
  app.innerHTML=view==="home"?vHome():view==="level"?vLevel():view==="exam"?vExam():view==="result"?vResult():view==="stats"?vStats():vSettings();
  tabs();flash="";
  const said=document.getElementById("said");if(said)said.addEventListener("input",onInput);
  const r=document.getElementById("rate");if(r)r.addEventListener("input",()=>{S.rate=+r.value;document.getElementById("rateV").textContent=S.rate.toFixed(2)+"×";save()});
  const oi=document.getElementById("ownIn");if(oi)oi.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addOwn()}});
  if(scrollTop)window.scrollTo(0,0);
}

/* ================= speech recognition ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let micMode=SR?"sr":"dict",micNote="",recog=null,recActive=false;
function stopRec(){if(recog){try{recog.abort()}catch(e){}}recActive=false;recog=null}
function toDict(note){stopRec();micMode="dict";micNote=note;render(false)}
function startRec(){
  const l=L();
  if(recActive){try{recog.stop()}catch(e){}return}
  if(hasTTS)speechSynthesis.cancel();
  let r;try{r=new SR()}catch(e){toDict(l.recDenied);return}
  recog=r;r.lang="de-DE";r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
  let got=false,last=null;
  const st=()=>document.getElementById("recStatus"),bt=()=>document.getElementById("recBtn");
  r.onstart=()=>{recActive=true;const b=bt();if(b){b.textContent=l.recOn;b.classList.add("live")}const s=st();if(s)s.textContent="";const f=document.getElementById("fb");if(f)f.hidden=true};
  r.onresult=e=>{const res=e.results[e.results.length-1];const alts=[];for(let k=0;k<res.length;k++)alts.push(res[k].transcript);
    last=alts;const s=st();if(s)s.textContent="… "+alts[0];
    if(res.isFinal&&!got){got=true;if(s)s.textContent="";doCheck(alts)}};
  r.onerror=e=>{const c=e.error;
    if(c==="not-allowed"||c==="service-not-allowed"||c==="audio-capture")toDict(c==="service-not-allowed"&&isIOS?l.recSiri:l.recDenied);
    else if(c==="network"){const s=st();if(s)s.textContent=l.recNet}
    else if(c!=="aborted"){const s=st();if(s)s.textContent=l.recNothing}};
  r.onend=()=>{recActive=false;const b=bt();if(b){b.textContent=l.recStart;b.classList.remove("live")}
    if(!got&&last){got=true;const s=st();if(s)s.textContent="";doCheck(last)}
    else if(!got){const s=st();if(s&&!s.textContent)s.textContent=l.recNothing}};
  try{r.start()}catch(e){toDict(l.recDenied)}
}

/* ================= actions ================= */
let autoT=null,lastChecked="";
function onInput(){clearTimeout(autoT);lastChecked="";const v=document.getElementById("said").value.trim();if(v)autoT=setTimeout(doCheck,1500)}
function showFb(r){const fb=document.getElementById("fb");fb.hidden=false;fb.className="fb "+r.cls;fb.innerHTML=r.html}
function curWord(){if(view==="exam"){const s=SETS[exam.lvl];return s.words[exam.order[exam.i]].w}const s=currentSet();return s.words[wi]?s.words[wi].w:""}
function doCheck(alts){
  clearTimeout(autoT);
  if(!Array.isArray(alts)){const inp=document.getElementById("said");if(!inp)return;
    const v=inp.value;if(v.trim()&&v===lastChecked)return;lastChecked=v;alts=[v]}
  if(view==="exam"&&exam.res[exam.i]!==undefined)return;
  const target=curWord();let r=null;
  for(const a of alts){const x=evaluate(plain(target),a);if(x.ok){r=x;break}if(!r)r=x}
  showFb(r);
  if(r.empty)return;
  if(view!=="exam"){record(target,r.ok);if(r.ok){const c=document.querySelectorAll(".list .cnt")[wi];const rec=S.words[plain(target)];if(c)c.textContent="✓ "+rec.ok}return}
  if(exam.res[exam.i]!==undefined)return;
  record(target,r.ok);
  const ctl=document.getElementById("examCtl"),l=L();
  if(r.ok){exam.res[exam.i]=true;ctl.innerHTML="";setTimeout(examNext,1200);return}
  exam.tries++;
  if(exam.tries<2){ctl.innerHTML=`<button class="primary" data-act="eretry">${esc(l.retryWord)}</button><button data-act="eskip">${esc(l.skip)}</button>`}
  else{exam.res[exam.i]=false;ctl.innerHTML=`<button class="primary" data-act="enext">${esc(l.cont2)}</button>`}
}
function examNext(){if(view!=="exam")return;exam.i++;exam.tries=0;
  if(exam.i>=exam.order.length){const n=exam.res.filter(x=>x).length,pct=Math.round(n/exam.order.length*100),id=SETS[exam.lvl].id;
    if(S.best[id]==null||pct>S.best[id])S.best[id]=pct;markDay();save();view="result"}
  render(true)}
function startExam(i){const s=SETS[i];const order=s.words.map((_,k)=>k);
  for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]]}
  exam={lvl:i,order,i:0,tries:0,res:[]};view="exam";render(true)}
function addOwn(){const oi=document.getElementById("ownIn");const v=(oi.value||"").trim().replace(/[\[\]<>]/g,"");if(!v)return;
  if(!S.custom.includes(v))S.custom.push(v);save();wi=S.custom.indexOf(v);render(false);setTimeout(()=>{const n=document.getElementById("ownIn");if(n)n.focus()},0)}

document.addEventListener("click",e=>{
  const say=e.target.closest("[data-say]");if(say){speak(say.dataset.say,false);return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,l=L();
  switch(a){
   case"tab":view=b.dataset.v;confirmReset=false;if(hasTTS)speechSynthesis.cancel();render(true);break;
   case"home":view="home";render(true);break;
   case"open":{const i=+b.dataset.i;if(!unlocked(i)){flash=l.lockedMsg;render(false);break}lvl=i;wi=0;view="level";render(true);break}
   case"own":lvl=-1;wi=0;view="level";render(true);break;
   case"levelback":view="level";render(true);break;
   case"listen":speak(plain(curWord()),false);break;
   case"slow":speak(plain(curWord()),true);break;
   case"speak":case"clear":{const i=document.getElementById("said");i.value="";lastChecked="";document.getElementById("fb").hidden=true;i.focus();break}
   case"check":doCheck();break;
   case"rec":startRec();break;
   case"usedict":stopRec();micMode="dict";micNote="";render(false);break;
   case"userec":micMode="sr";micNote="";render(false);break;
   case"prev":{const n=currentSet().words.length;wi=(wi-1+n)%n;render(false);break}
   case"next":{const n=currentSet().words.length;wi=(wi+1)%n;render(false);break}
   case"pick":wi=+b.dataset.i;render(false);window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});break;
   case"del":S.custom.splice(+b.dataset.i,1);wi=0;save();render(false);break;
   case"add":addOwn();break;
   case"exam":startExam(view==="result"?exam.lvl:lvl);break;
   case"eskip":exam.res[exam.i]=false;record(curWord(),false);examNext();break;
   case"enext":examNext();break;
   case"eretry":lastChecked="";render(false);break;
   case"lang":S.lang=b.dataset.v;save();render(false);break;
   case"test":S.test=!S.test;save();render(false);break;
   case"reset":confirmReset=true;render(false);break;
   case"resetno":confirmReset=false;render(false);break;
   case"resetyes":{const lang=S.lang;S=fresh();S.lang=lang;save();confirmReset=false;flash=l.resetDone;render(false);break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="said"){e.preventDefault();doCheck()}});

/* ================= study-time tracking ================= */
let lastAct=Date.now();
["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{if(!document.hidden&&Date.now()-lastAct<90000){S.stats.secs+=5;save()}},5000);

render(true);
</script>
</body></html>
