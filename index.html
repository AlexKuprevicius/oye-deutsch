<style>
/* Concept: the colours both flags share (black, red, gold). Gold = action, red = the sound to watch, ink = structure.
   Layout: phone app, one column, five tabs at the bottom; a dark "stage" card carries the word being practised. */
:root{
  --bg:#FFFFFF; --surface:#F5F2ED; --line:#E6E0D6; --ink:#15120E; --muted:#6B6359;
  --gold:#F4B400; --gold-ink:#15120E; --gold-soft:#FFF3CC;
  --red:#D3231B; --red-soft:#FDE5E2;
  --stage:#15120E; --stage-ink:#FBF6EC; --stage-muted:#B9AE9E;
  --ok:#1B7A47; --ok-soft:#DCF2E5; --warn:#94590A; --warn-soft:#FBEFD3; --bad:#B4231C; --bad-soft:#FBE1DE;
  --display:"Unbounded",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F0C; --surface:#1D1A15; --line:#312C24; --ink:#F7F1E6; --muted:#A79D8E;
  --gold:#FFC531; --gold-ink:#15120E; --gold-soft:#3A2F10;
  --red:#FF5B4F; --red-soft:#3D1714;
  --stage:#26211A; --stage-ink:#FBF6EC; --stage-muted:#B9AE9E;
  --ok:#6FD49C; --ok-soft:#14301F; --warn:#F2C46B; --warn-soft:#382B12; --bad:#FF8B82; --bad-soft:#3D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F0C; --surface:#1D1A15; --line:#312C24; --ink:#F7F1E6; --muted:#A79D8E;
  --gold:#FFC531; --gold-ink:#15120E; --gold-soft:#3A2F10;
  --red:#FF5B4F; --red-soft:#3D1714;
  --stage:#26211A; --stage-ink:#FBF6EC; --stage-muted:#B9AE9E;
  --ok:#6FD49C; --ok-soft:#14301F; --warn:#F2C46B; --warn-soft:#382B12; --bad:#FF8B82; --bad-soft:#3D1A17; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(100px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700;line-height:1.15}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* brand */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em}
.logo{width:38px;height:38px;border-radius:12px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;font-size:1.25rem;font-weight:800;position:relative}
.logo::after{content:"";position:absolute;inset:auto 6px 6px auto;width:7px;height:7px;border-radius:50%;background:var(--red)}
.brand span{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
/* surfaces */
.card{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.stage{background:var(--stage);color:var(--stage-ink);border-radius:26px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.stage .eyebrow{color:var(--stage-muted)}
.stage .ipa{color:var(--stage-muted)}
.word{font-family:var(--display);font-weight:700;font-size:clamp(2rem,10.5vw,3.2rem);line-height:1.05;margin:0;overflow-wrap:anywhere;text-wrap:balance;letter-spacing:-.02em}
.word.sentence{font-size:clamp(1.3rem,6vw,1.8rem);line-height:1.2}
.word mark{background:none;color:var(--gold);text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:4px;text-underline-offset:6px}
.note{background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;font-size:.95rem;color:var(--stage-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
/* buttons */
button,.btn{font:inherit;cursor:pointer;border-radius:999px;border:0;background:var(--bg);color:var(--ink);padding:11px 18px;min-height:46px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.card button:not(.gold):not(.red):not(.ghost):not(.lvl):not(.opt){background:var(--bg)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button.gold{background:var(--gold);color:var(--gold-ink)}
button.red{background:var(--red);color:#fff}
button.ghost{background:none;color:var(--ink);padding-inline:6px;text-decoration:underline;text-underline-offset:4px;font-weight:700;min-height:40px}
.stage button{background:rgba(255,255,255,.1);color:var(--stage-ink)}
.stage button.gold{background:var(--gold);color:var(--gold-ink)}
.stage button.red{background:var(--red);color:#fff}
.stage button.ghost{background:none;color:var(--stage-muted)}
button.wide{width:100%}
button.big{min-height:60px;font-size:1.1rem;border-radius:20px}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:default;transform:none}
button.live{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.7}}
.play{width:46px;min-width:46px;height:46px;padding:0;border-radius:50%}
.play svg{width:18px;height:18px;fill:currentColor}
/* sound wave */
.wave{display:inline-flex;gap:3px;align-items:center;height:22px}
.wave i{width:4px;height:6px;border-radius:2px;background:var(--gold);transition:height .2s}
.wave.on i{animation:wv .9s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.12s}.wave.on i:nth-child(3){animation-delay:.24s}.wave.on i:nth-child(4){animation-delay:.36s}.wave.on i:nth-child(5){animation-delay:.48s}
@keyframes wv{0%,100%{height:6px}50%{height:22px}}
/* feedback */
.fb{border-radius:16px;padding:12px 14px;font-size:.98rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)} .fb.warn{background:var(--warn-soft);color:var(--warn)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.tok{display:inline-block;margin:2px 4px 2px 0;padding:0 6px;border-radius:6px}
.tok.y{background:var(--ok-soft);color:var(--ok)} .tok.n{background:var(--bad-soft);color:var(--bad);text-decoration:underline}
.status{color:var(--stage-muted);min-height:1.5em;font-size:.95rem}
.steps{margin:0;padding-left:20px;color:var(--stage-muted);font-size:.92rem}
textarea{font:inherit;font-size:1.05rem;width:100%;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:rgba(255,255,255,.08);color:var(--stage-ink);resize:vertical;min-height:120px}
textarea::placeholder{color:var(--stage-muted)}
textarea:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.star{width:48px;min-width:48px;height:48px;padding:0;font-size:1.6rem;border-radius:14px;background:rgba(255,255,255,.08)!important;color:var(--stage-muted)!important}
.star.on{color:var(--gold)!important}
.fb a{color:inherit;font-weight:700}
input[type=text]{font:inherit;font-size:1.1rem;width:100%;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.stage input[type=text]{background:rgba(255,255,255,.08);border-color:transparent;color:var(--stage-ink)}
.stage input::placeholder{color:var(--stage-muted)}
.banner{background:var(--bad-soft);color:var(--bad);border-radius:16px;padding:12px 14px;font-size:.95rem}
.native{color:var(--stage-muted);font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .w{flex:1;min-width:0;text-align:left;background:none!important;border-radius:0;padding:12px 2px;font-size:1.05rem;justify-content:flex-start;font-weight:400}
.list .w[aria-current="true"]{font-weight:700}
.list .w mark{background:none;color:var(--red);font-weight:700}
.cnt{font-variant-numeric:tabular-nums;color:var(--ok);font-size:.85rem;white-space:nowrap}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair span{color:var(--muted);font-size:.85rem;text-align:center}
/* level path */
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:27px;top:28px;bottom:28px;width:4px;border-radius:2px;background:var(--line)}
.path li{position:relative}
.lvl{width:100%;display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:center;text-align:left;background:none;padding:8px 0;border-radius:18px;font-weight:400}
.node{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.05rem;background:var(--surface);color:var(--ink);border:4px solid var(--bg);position:relative;z-index:1}
.lvl.done .node{background:var(--gold);color:var(--gold-ink)}
.lvl.current .node{background:var(--red);color:#fff;box-shadow:0 0 0 4px var(--red-soft)}
.lvl.locked .node{color:var(--muted)}
.lvl.locked{opacity:.6}
.lvl b{display:block;font-size:1.02rem}
.lvl small{color:var(--muted);font-size:.82rem}
.lvl .st{font-size:.85rem;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.lvl.done .st{color:var(--ok)}
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--surface);border-radius:20px;padding:14px;font-weight:400;min-height:110px;justify-content:space-between}
.xt .em{font-size:1.6rem;line-height:1}
.xt b{font-size:.98rem;line-height:1.25}
.xt small{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
/* progress & stats */
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:20px;padding:14px}
.tile .v{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{color:var(--muted);font-size:.85rem}
.tile.hero{grid-column:1/-1;background:var(--stage);color:var(--stage-ink)}
.tile.hero .k{color:var(--stage-muted)}
.tile.hero .v{font-size:2.2rem;color:var(--gold)}
.big{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.18)}
.dots i.y{background:var(--ok)} .dots i.n{background:var(--red)} .dots i.c{outline:2px solid var(--gold);outline-offset:2px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--ink)!important;color:var(--bg)}
input[type=range]{width:100%;accent-color:var(--red)}
.help ol{margin:4px 0 0;padding-left:20px}
.help h3{margin-top:6px}
/* quiz */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:84px;border-radius:20px;font-family:var(--display);font-size:1.3rem;background:rgba(255,255,255,.1);color:var(--stage-ink)}
.opt.right{background:var(--ok)!important;color:#fff}
.opt.wrong{background:var(--red)!important;color:#fff}
/* streak week */
.week{display:flex;gap:6px}
.week span{flex:1;text-align:center;font-size:.72rem;color:var(--stage-muted)}
.week span i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.14);margin-bottom:4px}
.week span.y i{background:var(--gold)}
/* tabs & toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:2px;padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;max-width:130px;background:none;color:var(--muted);font-size:.72rem;font-weight:700;flex-direction:column;gap:2px;padding:6px 2px;border-radius:14px;min-height:52px}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="true"]{color:var(--ink)}
.tabs button[aria-current="true"] svg{stroke:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){button:active{transform:none}button.live,.wave.on i{animation:none}.wave.on i{height:14px}}
</style>

/* Online voice: a plain <audio> element is the most reliable way to make sound on iPhones
   (works with the silent switch on and inside in-app browsers). */
const isIOSdev=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function useOnline(){return S.voiceMode==="online"||(S.voiceMode==="auto"&&(isIOSdev||!hasTTS))}
let curAudio=null,diag="";
function setDiag(m){diag=m;const d=document.getElementById("diag");if(d)d.textContent=m}
function speakOnline(text,slow){
  if(curAudio){try{curAudio.pause()}catch(e){}}
  const url="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&ttsspeed="+(slow?"0.3":"1")+"&q="+encodeURIComponent(text.slice(0,190));
  const a=new Audio(url);a.setAttribute("playsinline","");a.preload="auto";curAudio=a;
  a.referrerPolicy="no-referrer";
  a.onplaying=()=>{ttsWarn(false);waveOn(true);setDiag("OK: online")};a.onended=()=>waveOn(false);a.onpause=()=>waveOn(false);
  a.onerror=()=>{waveOn(false);setDiag("Online-Fehler: "+(a.error?a.error.code+" "+(a.error.message||""):"?"));if(hasTTS&&S.voiceMode!=="online")speakDevice(text,slow);else ttsWarn(true)};
  const p=a.play();if(p&&p.catch)p.catch(err=>{setDiag("Online play(): "+(err&&err.name)+" "+(err&&err.message||""));if(err&&err.name==="NotAllowedError")ttsWarn(true)});

function speak(text,slow){
  S.stats.listens++;markDay();save();
  if(useOnline()){speakOnline(text,slow);return}
  speakDevice(text,slow);
}
function speakDevice(text,slow){
  if(!hasTTS){ttsWarn(true);return}
  if(!voice)pickVoice();
  const go=()=>{let started=false;
    const u=new SpeechSynthesisUtterance(text);u.lang="de-DE";if(voice)u.voice=voice;
    u.rate=slow?Math.max(.35,S.rate*.55):S.rate;u.pitch=1;u.volume=1;
    u.onstart=()=>{started=true;ttsWarn(false);waveOn(true);setDiag("OK: Handy-Stimme "+(voice?voice.name:"Standard"))};u.onend=()=>waveOn(false);
    u.onerror=ev=>{waveOn(false);setDiag("Handy-Stimme Fehler: "+(ev&&ev.error));if(!started)ttsWarn(true)};
    try{speechSynthesis.resume()}catch(e){}
    speechSynthesis.speak(u);
    setTimeout(()=>{if(!started&&!speechSynthesis.speaking){ttsWarn(true);if(!diag.startsWith("Handy"))setDiag("Handy-Stimme startet nicht ("+speechSynthesis.getVoices().length+" Stimmen)")}},2500)};
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,150)}else go();
}

/* ================= evaluation ================= */
function evaluate(target,heard){
  const t=norm(target),h=norm(heard),l=L();
  if(!h)return{ok:false,cls:"warn",html:esc(l.fbEmpty),empty:true};
  const tt=t.split(" "),ht=h.split(" ");
  if(t===h||(tt.length>1&&tt.every(x=>ht.includes(x))))return{ok:true,cls:"ok",html:`<b>${esc(l.fbOk)}</b> «${esc(heard.trim())}»`};
  if(tt.length>1){const toks=tt.map(x=>`<span class="tok ${ht.includes(x)?"y":"n"}">${esc(x)}</span>`).join("");
    return{ok:false,cls:"warn",html:`${esc(l.fbHeard)} «${esc(heard.trim())}»<br>${esc(l.fbAlmost)}<br>${toks}`}}
  let hint="";
  if(deUml(t)===deUml(h)||deUml(t)===h.replace(/e/g,"o")){hint=t.includes("ö")?l.hOe:t.includes("ü")?l.hUe:l.hUml}
  else if(t.includes("sch")&&(h===t.replace(/sch/g,"s")||h===t.replace(/sch/g,"ch")||h==="e"+t))hint=h==="e"+t?l.hE:l.hSch;
  else if(/^(sp|st)/.test(t)&&h==="e"+t)hint=l.hE;
  else if(t.includes("ch")&&!t.includes("sch")&&h===t.replace(/ch/g,"sch"))hint=l.hChSch;
  else if(t.includes("ch")&&h.replace(/sch|tsch|k|j/g,"ch")===t)hint=l.hCh;
  else if(t.startsWith("h")&&h===t.slice(1))hint=l.hH;
  else if(t.includes("r")&&(h===t.replace(/r/g,"l")||h===t.replace(/r/g,"")||h===t.replace(/r/g,"rr")))hint=l.hR;
  return{ok:false,cls:"bad",html:`${esc(l.fbHeard)} <b>«${esc(heard.trim())}»</b><br>${esc(hint||l.fbRetry)}`};
}
const GAPS=[0,1,2,4,8,16];
function record(word,ok){
  const k=plain(word);const r=S.words[k]||(S.words[k]={ok:0,fail:0});
  ok?r.ok++:r.fail++;S.stats.tries++;if(ok)S.stats.ok++;
  const s=S.srs[k]||{b:0,d:0};
  if(ok){s.b=Math.min(s.b+1,GAPS.length-1);s.d=Date.now()+GAPS[s.b]*864e5}else{s.b=0;s.d=Date.now()}
  S.srs[k]=s;
  if(ok&&cur.kind==="daily"&&view==="set")S.dailyDone=today();
  markDay();save();
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let micMode=SR?"sr":"dict",micNote="",recog=null,recActive=false;
function stopRec(){if(recog){try{recog.abort()}catch(e){}}recActive=false;recog=null}
function toDict(note){stopRec();micMode="dict";micNote=note;render(false)}
function startRec(){
  const l=L();
  if(recActive){try{recog.stop()}catch(e){}return}
  if(hasTTS)speechSynthesis.cancel();
  let r;try{r=new SR()}catch(e){toDict(l.recDenied);return}
  recog=r;r.lang="de-DE";r.interimResults=true;r.maxAlternatives=5;r.continuous=false;
  let got=false,last=null;
  const st=()=>$("recStatus"),bt=()=>$("recBtn");
  r.onstart=()=>{recActive=true;const b=bt();if(b){b.textContent=l.recOn;b.classList.add("live")}const s=st();if(s)s.textContent="";const f=$("fb");if(f)f.hidden=true};
  r.onresult=e=>{const res=e.results[e.results.length-1];const alts=[];for(let k=0;k<res.length;k++)alts.push(res[k].transcript);
    last=alts;const s=st();if(s)s.textContent="… "+alts[0];
    if(res.isFinal&&!got){got=true;if(s)s.textContent="";doCheck(alts)}};
  r.onerror=e=>{const c=e.error;
    if(c==="not-allowed"||c==="service-not-allowed"||c==="audio-capture")toDict(c==="service-not-allowed"&&isIOS?l.recSiri:l.recDenied);
    else if(c==="network"){const s=st();if(s)s.textContent=l.recNet}
    else if(c!=="aborted"){const s=st();if(s)s.textContent=l.recNothing}};
  r.onend=()=>{recActive=false;const b=bt();if(b){b.textContent=l.recStart;b.classList.remove("live")}
    if(!got&&last){got=true;const s=st();if(s)s.textContent="";doCheck(last)}
    else if(!got){const s=st();if(s&&!s.textContent)s.textContent=l.recNothing}};
  try{r.start()}catch(e){toDict(l.recDenied)}
}

const canSelf=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let mrec=null,myUrl=null,myKey="",mTimer=null;
function selfUI(){const el=$("selfRow");if(!el)return;const l=L(),k=plain(curWord());
  const has=myUrl&&myKey===k,on=mrec&&mrec.state==="recording";
  el.innerHTML=`<button data-act="self" class="${on?"red live":""}">${esc(on?l.selfStop:"🎙 "+l.self)}</button>${has&&!on?`<button data-act="selfme">${esc(l.selfMe)}</button><button data-act="listen">${esc(l.selfOrig)}</button>`:""}`}
async function toggleSelf(){
  const l=L();
  if(mrec&&mrec.state==="recording"){mrec.stop();return}
  if(recActive)stopRec();if(hasTTS)speechSynthesis.cancel();
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast(l.selfDenied);return}
  const types=["audio/mp4","audio/webm;codecs=opus","audio/webm"];const mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  let r;try{r=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream)}catch(e){stream.getTracks().forEach(t=>t.stop());toast(l.selfDenied);return}
  const chunks=[],k=plain(curWord());mrec=r;
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  r.onstop=()=>{clearTimeout(mTimer);stream.getTracks().forEach(t=>t.stop());
    if(myUrl)URL.revokeObjectURL(myUrl);myUrl=URL.createObjectURL(new Blob(chunks,{type:r.mimeType||mt||"audio/webm"}));myKey=k;mrec=null;selfUI();
    try{new Audio(myUrl).play()}catch(e){}};
  r.start();mTimer=setTimeout(()=>{if(r.state==="recording")r.stop()},8000);selfUI();
}

   <div class="seg"><button data-act="lang" data-v="de" aria-pressed="${S.lang==="de"}">🇩🇪 Deutsch</button><button data-act="lang" data-v="es" aria-pressed="${S.lang==="es"}">🇪🇸 Español</button></div></section>
  <section class="card"><label class="eyebrow" for="rate">${esc(l.rate)}: <span id="rateV">${S.rate.toFixed(2)}×</span></label>
   <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="${S.rate}">
   <div class="row"><button data-say="Brötchen">▶ Brötchen</button>${wave}</div></section>
  <section class="card"><div class="row between" style="flex-wrap:nowrap"><div style="min-width:0"><h3>${esc(l.testMode)}</h3><p class="muted" style="font-size:.9rem">${esc(l.testSub)}</p></div>
   <button data-act="test" aria-pressed="${S.test}" class="${S.test?"gold":""}" style="min-width:64px">${esc(S.test?l.on:l.off)}</button></div></section>
  <section class="card help"><h3>${esc(l.help)}</h3><p class="muted">${esc(l.helpMic)}</p>
   <h3>${esc(l.iph)}</h3><ol>${l.helpI.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <h3>${esc(l.and)}</h3><ol>${l.helpA.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
   <p class="muted" style="font-size:.9rem">${esc(l.helpN)}</p></section>
  ${fbCardHtml("settings")}
  <section class="card">${confirmReset?`<p><b>${esc(l.resetQ)}</b></p><div class="row"><button class="red" data-act="resetyes">${esc(l.yes)}</button><button data-act="resetno">${esc(l.no)}</button></div>`
   :`<button data-act="reset">${esc(l.reset)}</button>`}${flash?`<div class="fb ok">${esc(flash)}</div>`:""}</section>`;
}

const ICONS={today:'<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/>',levels:'<path d="M4 20h4v-6H4zM10 20h4V9h-4zM16 20h4V4h-4z"/>',extras:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',stats:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/>'};
function tabOf(){if(["today","levels","extras","stats","settings"].includes(view))return view;
  if(view==="set")return cur.kind==="level"?"levels":cur.kind==="daily"||cur.kind==="review"?"today":"extras";
  if(view==="exam"||view==="result")return exam.kind==="level"?"levels":exam.kind==="review"?"today":"extras";
  if(view==="quiz"||view==="quizres")return quiz.back;
  if(view==="feedback")return ["today","levels","extras","stats","settings"].includes(fbFrom)?fbFrom:"today";return "today"}
function tabs(){const l=L(),act=tabOf();
  $("tabs").innerHTML=[["today",l.tToday],["levels",l.tLevels],["extras",l.tExtras],["stats",l.tStats],["settings",l.tSet]]
   .map(([k,t])=>`<button data-act="tab" data-v="${k}" aria-current="${act===k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${esc(t)}</button>`).join("")}

function render(scrollTop){
  if(recActive)stopRec();
  document.documentElement.lang=S.lang;
  const V={today:vToday,levels:vLevels,extras:vExtras,set:vSet,exam:vExam,result:vResult,quiz:vQuiz,quizres:vQuizResult,stats:vStats,settings:vSettings,feedback:vFeedback};
  app.innerHTML=(V[view]||vToday)();
  tabs();flash="";
  const said=$("said");if(said)said.addEventListener("input",onInput);
  const r=$("rate");if(r)r.addEventListener("input",()=>{S.rate=+r.value;$("rateV").textContent=S.rate.toFixed(2)+"×";save()});
  const oi=$("ownIn");if(oi)oi.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addOwn()}});
  selfUI();paintFb();
  if(scrollTop)window.scrollTo(0,0);
}

/* ================= actions ================= */
let autoT=null,lastChecked="";
function onInput(){clearTimeout(autoT);lastChecked="";const v=$("said").value.trim();if(v)autoT=setTimeout(doCheck,1500)}
function showFb(r){const fb=$("fb");if(!fb)return;fb.hidden=false;fb.className="fb "+r.cls;fb.innerHTML=r.html}
function curWord(){if(view==="exam"){return exam.set.words[exam.order[exam.i]].w}const s=getSet();return s&&s.words[wi]?s.words[wi].w:""}
function doCheck(alts){
  clearTimeout(autoT);
  if(!Array.isArray(alts)){const inp=$("said");if(!inp)return;const v=inp.value;if(v.trim()&&v===lastChecked)return;lastChecked=v;alts=[v]}
  if(view==="exam"&&exam.res[exam.i]!==undefined)return;
  const target=curWord();if(!target)return;let r=null;
  for(const a of alts){const x=evaluate(plain(target),a);if(x.ok){r=x;break}if(!r)r=x}
  showFb(r);if(r.empty)return;
  record(target,r.ok);
  if(view!=="exam"){if(r.ok){const c=document.querySelectorAll(".list .cnt")[wi];const rec=S.words[plain(target)];if(c)c.textContent="✓ "+rec.ok}return}
  const ctl=$("examCtl"),l=L();
  if(r.ok){exam.res[exam.i]=true;ctl.innerHTML="";setTimeout(examNext,1200);return}
  exam.tries++;
  if(exam.tries<2){ctl.innerHTML=`<button class="gold" data-act="eretry">${esc(l.retryWord)}</button><button data-act="eskip">${esc(l.skip)}</button>`}
  else{exam.res[exam.i]=false;ctl.innerHTML=`<button class="gold" data-act="enext">${esc(l.cont2)}</button>`}
}
function examNext(){if(view!=="exam")return;exam.i++;exam.tries=0;
  if(exam.i>=exam.order.length){const n=exam.res.filter(x=>x).length,pct=Math.round(n/exam.order.length*100),id=exam.set.id;
    if(exam.kind==="level"||exam.kind==="extra"){if(S.best[id]==null||pct>S.best[id])S.best[id]=pct}
    markDay();save();view="result"}
  render(true)}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function startExam(kind,i){
  const c={kind,i},set=getSet(c);if(!set||!set.words.length)return;
  exam={kind,i0:i,set,order:shuffle(set.words.map((_,k)=>k)),i:0,tries:0,res:[]};view="exam";render(true)}
function startQuiz(setOnly){
  const src=setOnly?[getSet()]:ALLSETS;const pairs=src.flatMap(s=>s.pairs||[]);if(!pairs.length)return;
  const items=[];const pool=shuffle(pairs.slice());
  for(let k=0;k<10;k++){const p=pool[k%pool.length];items.push({pair:Math.random()<.5?[p[0],p[1]]:[p[1],p[0]],target:p[Math.random()<.5?0:1],ans:null})}
  quiz={items,q:0,back:view==="set"?(cur.kind==="level"?"levels":"extras"):(view==="today"||view==="quizres"&&quiz&&quiz.back==="today")?"today":"extras",
    label:setOnly?tx(getSet().title):"",setId:setOnly?getSet().id:null};
  speak(items[0].target,false);view="quiz";render(true)}
function addOwn(){const oi=$("ownIn");const v=(oi.value||"").trim().replace(/[\[\]<>]/g,"");if(!v)return;
  if(!S.custom.includes(v))S.custom.push(v);save();wi=S.custom.indexOf(v);render(false);setTimeout(()=>{const n=$("ownIn");if(n)n.focus()},0)}
function openSet(kind,i){cur={kind,i};wi=0;view="set";render(true)}

document.addEventListener("click",e=>{
  const say=e.target.closest("[data-say]");if(say){speak(say.dataset.say,false);return}
  const b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  const a=b.dataset.act,l=L();
  switch(a){
   case"tab":view=b.dataset.v;confirmReset=false;if(hasTTS)speechSynthesis.cancel();render(true);break;
   case"open":{const k=b.dataset.k||"level",i=+(b.dataset.i||0);if(k==="level"&&!unlocked(i)){flash=l.lockedMsg;view="levels";render(false);break}openSet(k,i);break}
   case"daily":openSet("daily",0);break;
   case"review":reviewList=dueWords().slice(0,10);if(reviewList.length){cur={kind:"review",i:0};startExam("review",0)}break;
   case"listen":speak(plain(curWord()),false);break;
   case"slow":speak(plain(curWord()),true);break;
   case"rec":startRec();break;
   case"kb":case"clear":{const i=$("said");if(!i)break;i.value="";lastChecked="";const f=$("fb");if(f)f.hidden=true;i.focus();break}
   case"check":doCheck();break;
   case"usedict":stopRec();micMode="dict";micNote="";render(false);break;
   case"userec":micMode="sr";micNote="";render(false);break;
   case"self":toggleSelf();break;
   case"selfme":playMine();break;
   case"prev":{const n=getSet().words.length;wi=(wi-1+n)%n;render(false);break}
   case"next":{const n=getSet().words.length;wi=(wi+1)%n;render(false);break}
   case"pick":wi=+b.dataset.i;render(false);window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});break;
   case"del":S.custom.splice(+b.dataset.i,1);wi=0;save();render(false);break;
   case"add":addOwn();break;
   case"exam":if(view==="result")startExam(exam.kind,exam.i0);else startExam(cur.kind,cur.i);break;
   case"examquit":view=exam.kind==="review"?"today":"set";if(exam.kind!=="review")cur={kind:exam.kind,i:exam.i0};render(true);break;
   case"eskip":if(exam.res[exam.i]===undefined){exam.res[exam.i]=false;record(curWord(),false)}examNext();break;
   case"enext":examNext();break;
   case"eretry":lastChecked="";render(false);break;
   case"quiz":startQuiz(false);break;
   case"quizset":if(view==="quizres"&&quiz.setId){const k=ALLSETS.findIndex(s=>s.id===quiz.setId);cur=k<SETS.length?{kind:"level",i:k}:{kind:"extra",i:k-SETS.length}}startQuiz(true);break;
   case"qplay":speak(quiz.items[quiz.q].target,false);break;
   case"qans":{const it=quiz.items[quiz.q];if(it.ans!=null)break;it.ans=b.dataset.w;S.stats.quiz++;if(it.ans===it.target)S.stats.quizOk++;markDay();save();render(false);break}
   case"qnext":if(quiz.q+1<quiz.items.length){quiz.q++;render(false);speak(quiz.items[quiz.q].target,false)}else{view="quizres";render(true)}break;
   case"sharelevel":share(l.shareLevel(tx(exam.set.title),b.dataset.p));break;
   case"sharequiz":share(l.shareLevel(l.quiz,Math.round(+b.dataset.n/quiz.items.length*100)));break;
   case"sharestats":share(l.shareStats(streak(),SETS.filter((s,i)=>isPassed(i)).length));break;
   case"lang":S.lang=b.dataset.v;save();render(false);break;
   case"feedback":fbFrom=b.dataset.from||"today";fbState="";fbStars=0;view="feedback";render(true);break;
   case"fbstar":fbStars=+b.dataset.n;if(fbState==="empty"||fbState==="sent")fbState="";paintFb();break;
   case"fbsend":sendFeedback();break;
   case"test":S.test=!S.test;save();render(false);break;
   case"vmode":S.voiceMode=b.dataset.v;save();render(false);speak("Hallo, ich bin Oye Deutsch.",false);break;
   case"reset":confirmReset=true;render(false);break;
   case"resetno":confirmReset=false;render(false);break;
   case"resetyes":{const lang=S.lang;S=fresh();S.lang=lang;save();confirmReset=false;flash=l.resetDone;render(false);break}
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="said"){e.preventDefault();doCheck()}});

/* ================= study time ================= */
let lastAct=Date.now();
["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now()},true));
setInterval(()=>{if(!document.hidden&&Date.now()-lastAct<90000){S.stats.secs+=5;save()}},5000);

render(true);

</script>
</body></html>
